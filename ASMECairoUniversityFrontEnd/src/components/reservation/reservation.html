<div class="reservation-container">
  <div class="reservation-card">

    <div class="card-header">
      <div class="header-icon">
        <i class="fa-solid fa-ticket-alt"></i> </div>
      <h2>RESERVE YOUR SPOT</h2>
    </div>

    <div class="card-body">
      <div *ngIf="!resData" class="loading-data">
        <p>Loading details...</p>
      </div>

      <div *ngIf="resData" class="reservation-details">
        <div class="detail-item">
          <p class="detail-label">Registration closes in:</p>
          <p class="deadline-text">{{ backendDeadline }}</p>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn btn-primary" (click)="onRegister()">
        Register Now
      </button>
      <button class="btn btn-secondary" (click)="onAddToCalendar()">
        Add to Calendar
      </button>
    </div>
  </div>
</div>
