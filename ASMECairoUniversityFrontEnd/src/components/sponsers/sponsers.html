<div class="sponsors-card">
  <div class="card-header">
    <div class="icon-container">
      🏆 </div>
    <h2>EVENT SPONSORS</h2>
  </div>

  <div class="card-body">
    <div *ngIf="categoriesData.length === 0" class="loading-state">
      <p>Loading sponsors...</p>
    </div>

    <div class="category-section" *ngFor="let category of categoriesData">

      <div class="category-header">
        <span class="line"></span>
        <h3 class="category-title">{{ category.categoryName }}</h3>
        <span class="line"></span>
      </div>

      <div class="sponsors-grid">
        <div class="sponsor-item" *ngFor="let sponsor of category.sponsors">
          <img *ngIf="sponsor.logoUrl" [src]="sponsor.logoUrl" [alt]="sponsor.name" class="sponsor-logo">
          <span *ngIf="!sponsor.logoUrl" class="sponsor-name">{{ sponsor.name }}</span>
        </div>
      </div>

    </div>
  </div>
</div>
