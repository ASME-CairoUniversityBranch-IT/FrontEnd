<section id="home" class="hero-section">
  <div class="hero-grid-bg"></div>
  <div class="hero-particles" id="heroBannerParticles"></div>

  @if (heroContent; as HERO_CONTENT) {
    <div class="hero-content">
      <div class="hero-text-col">
        <div class="hero-badge">
          <span class="badge-dot"></span>
          {{ HERO_CONTENT.badge }}
        </div>

        <h1 class="hero-title">
          @for (line of HERO_CONTENT.titleLines; track $index; let i = $index) {
            <span
              class="title-line"
              [class.accent]="i === 1"
              [style.animation-delay]="(0.5 + i * 0.15) + 's'">
              {{ line }}
            </span>
          }
        </h1>

        <p class="hero-subtitle">{{ HERO_CONTENT.subtitle }}</p>

        <div class="hero-actions">
          <a [href]="HERO_CONTENT.ctaPrimary.href" class="btn-primary">
            <span>{{ HERO_CONTENT.ctaPrimary.label }}</span>
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </a>
        </div>
      </div>
      <div class="hero-image-col">
        <div class="hero-img-frame">
          <img src="images/team.jpg" alt="ASME Cairo team" />
        </div>
      </div>
    </div>

    <app-hero-stats [stats]="HERO_CONTENT.stats" />
  }
</section>
