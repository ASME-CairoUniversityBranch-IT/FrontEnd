<section class="contact-section">

  <div class="contact-container">


    <div class="contact-info" data-aos="fade-right" data-aos-duration="800">

      <p class="subtitle" data-aos="fade-right" data-aos-duration="1000">GET IN TOUCH</p>
      <h1 class="title">CONTACT US</h1>

      <h5 class="hear-text">We'd love to hear from you</h5>


      <div class="info-item">

        <div class="icon">
          <img width="40" height="40" src="https://img.icons8.com/office/40/marker.png" alt="marker"/>
        </div>

        <div class="info-text">
          <h4>LOCATION</h4>
          <p>
            Faculty of Engineering, Cairo University <br>
            Giza, Egypt
          </p>
        </div>


      </div>
      <hr>



      <div class="info-item">

        <div class="icon">
          <img width="48" height="48" src="https://img.icons8.com/color/48/email.png" alt="email"/>
        </div>

        <div class="info-text">
          <h4>EMAIL</h4>
          <p>[email protected]</p>
        </div>

      </div>

      <hr>


      <div class="info-item">

        <div class="icon">
          <img width="94" height="94" src="https://img.icons8.com/3d-fluency/94/facebook-logo.png" alt="facebook-logo"/>
        </div>

        <div class="info-text">
          <h4>FACEBOOK</h4>
          <p>ASME Cairo University Branch</p>
        </div>

      </div>

      <hr>


      <div class="info-item">

        <div class="icon">
          <img width="94" height="94" src="https://img.icons8.com/3d-fluency/94/instagram-logo.png" alt="instagram-logo"/>
        </div>

        <div class="info-text">
          <h4>INSTAGRAM</h4>
          <p>@asme.cairouniversity</p>
        </div>

      </div>

      <hr>


      <div class="info-item">

        <div class="icon">
          <img width="48" height="48" src="https://img.icons8.com/color/48/linkedin.png" alt="linkedin"/>
        </div>

        <div class="info-text">
          <h4>LINKEDIN</h4>
          <p>ASME Student Branch – Cairo University</p>
        </div>

      </div>

    </div>



    <div class="contact-form" data-aos="fade-down" data-aos-duration="1200">

      <form>

        <div class="row">

          <div class="input-group">
            <label>FULL NAME</label>
            <input type="text" placeholder="Ahmed Mohamed">
          </div>

          <div class="input-group">
            <label>EMAIL</label>
            <input type="email" placeholder="[email protected]">
          </div>

        </div>

        <div class="input-group">
          <label>SUBJECT</label>
          <input type="text" placeholder="What is this about?">
        </div>

        <div class="input-group">
          <label>MESSAGE</label>
          <textarea rows="6" placeholder="Your message..."></textarea>
        </div>

        <button class="send-btn">
          SEND MESSAGE
        </button>

      </form>
      </div>

    </div>



</section>
