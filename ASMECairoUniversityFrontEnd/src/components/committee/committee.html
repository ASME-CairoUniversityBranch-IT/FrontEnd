<section class="committee-section" id="committees" *ngIf="loaded" aria-label="Our committees">

  <div class="header">
    <p class="subtitle"><span aria-hidden="true"></span> {{ subtitle }}</p>
    <h2 class="main-title">{{ title }}</h2>
  </div>

  <div class="pillars-grid">
    <section
      class="pillar-column"
      *ngFor="let c of committees; let i = index"
      [ngClass]="'pillar-' + i">

      <!-- Pillar Header -->
      <header class="pillar-header">
        <div class="pillar-header-top">
          <span class="pillar-index" aria-hidden="true">0{{ i + 1 }}</span>
          <span class="pillar-count">{{ c.subTeams.length }} SUB-TEAMS</span>
        </div>
        <h3 class="pillar-title">{{ c.title }}</h3>
        <div class="pillar-rule" aria-hidden="true"></div>
      </header>

      <!-- Sub-Teams List inside this Pillar -->
      <div class="subteam-stack">
        <article class="subteam-item" *ngFor="let team of c.subTeams">
          <div class="subteam-icon-box" aria-hidden="true">
            <i [class]="team.icon"></i>
          </div>

          <div class="subteam-body">
            <h4 class="subteam-name">{{ team.name }}</h4>
            <p class="subteam-description">{{ team.description }}</p>
          </div>
        </article>
      </div>

    </section>
  </div>

</section>
