<section class="projects-section" id="projects">

  <div class="header">
    <p class="subtitle"><span aria-hidden="true"></span> WHAT WE DO</p>
    <h2 class="main-title">OUR PROJECTS</h2>
  </div>

  <div class="tabs-container">
    <ul class="tabs" role="tablist" aria-label="Project categories">
      <li *ngFor="let t of tabs" role="presentation">
        <button
          type="button"
          class="tab-button"
          role="tab"
          [class.active]="activeTab === t"
          [attr.aria-selected]="activeTab === t"
          (click)="switchTab(t)">
          <i [class]="projectTypeIcon(t) + ' type-icon'" aria-hidden="true"></i>
          {{ projectTypeLabel(t) }}
        </button>
      </li>
    </ul>
    <hr class="tabs-line">
  </div>

  <ng-container *ngIf="vm$ | async as vm">
    <p class="loading-msg" *ngIf="vm.status === 'loading'">
      <span class="spinner"></span>
      Loading projects...
    </p>

    <div class="cards-grid" *ngIf="vm.status === 'loaded'">
      <ng-container *ngIf="projectsForTab(vm.projects) as filtered">
        <a class="card" *ngFor="let project of filtered" [routerLink]="projectDetailPath(project)">
          <div class="card-image-box">
            <img *ngIf="project.coverImageUrl" [src]="project.coverImageUrl" [alt]="project.title" loading="lazy" decoding="async">
            <i *ngIf="!project.coverImageUrl" [class]="projectTypeIcon(project.type) + ' icon'" aria-hidden="true"></i>
          </div>

          <div class="card-content">
            <h3 class="card-title">{{ project.title }}</h3>
            <p class="card-description">{{ project.shortDescription }}</p>
            <p class="card-date"><span class="date-label">DATE</span> {{ project.mainDateAndTime | date:'mediumDate' }}</p>
          </div>
        </a>
        <p class="empty-msg" *ngIf="filtered.length === 0">No {{ projectTypeLabel(activeTab) | lowercase }} yet — check back soon.</p>
      </ng-container>
    </div>
  </ng-container>

  <div class="action-container">
    <a routerLink="/projects" class="view-all-btn">VIEW ALL PROJECTS &rarr;</a>
  </div>

</section>
