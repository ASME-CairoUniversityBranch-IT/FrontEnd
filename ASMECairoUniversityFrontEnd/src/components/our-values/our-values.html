<section class="section" id="our-values" *ngIf="loaded">
  <p class="section-label">{{ sectionLabel }}</p>
  <h2 class="section-title">{{ sectionTitle }}</h2>

  <div class="cards-grid">
    <div
      class="card-wrapper"
      *ngFor="let card of cards; let i = index"
      [class.open]="card.isOpen"
    >
      <!-- Base Card -->
      <div class="card">
        <span class="card-tag">{{ card.tag }}</span>
        <h3 class="card-title">{{ card.title }}</h3>
      </div>

      <!-- Overlay Card -->
      <div
        class="overlay-card"
        [id]="'value-details-' + i"
        role="region"
        [attr.aria-label]="card.title + ' details'"
        [attr.aria-hidden]="!card.isOpen"
        [attr.inert]="!card.isOpen ? '' : null">
        <span class="overlay-tag">{{ card.tag }}</span>
        <h3 class="overlay-title">{{ card.title }}</h3>
        <div class="overlay-divider"></div>
        <p class="overlay-body">{{ card.overlayBody1 }}</p>
        <p class="overlay-body">{{ card.overlayBody2 }}</p>
      </div>

      <!-- Plus Button -->
      <button
        type="button"
        class="plus-btn"
        (click)="openCard(card, $event.currentTarget)"
        [attr.aria-label]="'Learn more about ' + card.title"
        [attr.aria-expanded]="card.isOpen"
        [attr.aria-controls]="'value-details-' + i"
        [attr.tabindex]="card.isOpen ? -1 : 0"
      >
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 2v12M2 8h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Close Button -->
      <button
        type="button"
        class="close-btn"
        (click)="closeCard(card)"
        [attr.aria-label]="'Close ' + card.title + ' details'"
        [attr.tabindex]="card.isOpen ? 0 : -1"
      >
        <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 2l10 10M12 2L2 12" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</section>
