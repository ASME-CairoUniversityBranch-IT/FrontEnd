
<section class="about-section" id="about" *ngIf="content as c">

  <div class="left-side" data-aos="fade-right" data-aos-duration="1000">
    <p class="who-we-are"><span>—</span> {{ c.eyebrow }}</p>
    <h1 class="main-title">{{ c.titleLine1 }}<br>{{ c.titleLine2 }}</h1>

    <div class="organization-box">
      <h4 class="org-title">{{ c.organizationTitle }}</h4>
      <p *ngFor="let paragraph of c.organizationParagraphs">{{ paragraph }}</p>
    </div>
  </div>

  <div class="right-side">
    <div class="info-card" *ngFor="let card of c.cards" data-aos="fade-up" data-aos-duration="1000">
      <h3 class="card-title">
        <span class="icon">{{ card.icon }}</span> {{ card.title }}
      </h3>
      <p class="card-description">{{ card.description }}</p>
    </div>
  </div>

</section>
