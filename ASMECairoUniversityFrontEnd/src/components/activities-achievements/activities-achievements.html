<ng-container *ngIf="content as ACTIVITY_CONTENT">
<!-- ═══════════════ CAROUSEL ═══════════════ -->
<section class="carousel-section" id="featured">
  <div class="carousel-header">
    <span class="section-title">{{ ACTIVITY_CONTENT.featuredHighlightsLabel }}</span>
    <div class="carousel-nav-btns">
      <button class="carousel-btn" (click)="prevSlide()" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="carousel-btn" (click)="nextSlide()" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div
    class="carousel-viewport"
    (mouseenter)="onCarouselEnter()"
    (mouseleave)="onCarouselLeave()">
    <div class="carousel-slides" id="activityCarouselSlides">
      <div
  class="carousel-slide"
  *ngFor="let slide of ACTIVITY_CONTENT.slides"
  [style.background]="slide.bg"
>

  <!-- Background mesh -->
  <div class="slide-mesh"></div>

  <!-- Decorative SVG -->
  <div
    class="slide-deco"
    [innerHTML]="slide.decoSvg">
  </div>

  <!-- LEFT: Text -->
  <div class="slide-content">

    <span class="slide-tag">
      {{ slide.tag }}
    </span>

    <h2 class="slide-title">
      {{ slide.title }}
    </h2>

    <p class="slide-desc">
      {{ slide.desc }}
    </p>

  </div>

  <!-- RIGHT: Image -->
  <div class="slide-image">
    <img
      [src]="slide.image"
      [alt]="slide.title"
    />
  </div>

</div>
    </div>
  </div>

  <div class="carousel-dots">
    <button
      *ngFor="let slide of ACTIVITY_CONTENT.slides; let i = index"
      class="dot"
      [class.active]="currentSlide === i"
      (click)="goTo(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)">
    </button>
  </div>
</section>

<!-- ═══════════════ ACHIEVEMENTS ═══════════════ -->
<section id="achievements" class="achievements-section">
  <div class="section-title">
    <span class="section-label">{{ ACTIVITY_CONTENT.achievementsEyebrow }}</span>
    <h2 class="section-title">{{ ACTIVITY_CONTENT.achievementsTitle }}</h2>
  </div>

<div class="achievements-grid">
  <div
    class="achievement-card"
    *ngFor="let a of ACTIVITY_CONTENT.achievements">

    <div class="achievement-accent"></div>

    <div class="achievement-icon">
      <img
        [src]="a.image"
        [alt]="a.title"
      />
    </div>

    <h3 class="achievement-title">{{ a.title }}</h3>

    <p class="achievement-desc">{{ a.desc }}</p>

  </div>
</div>
</section>
</ng-container>
