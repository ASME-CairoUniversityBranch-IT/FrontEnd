<div class="sponsors-card" *ngIf="groups.length">
  <div class="card-header">
    <div class="section-mark" aria-hidden="true">SP</div>
    <h2>EVENT SPONSORS</h2>
  </div>

  <div class="card-body">
    <div class="category-section" *ngFor="let group of groups">
      <div class="category-header">
        <span class="line"></span>
        <h3 class="category-title">{{ group.tierName }}</h3>
        <span class="line"></span>
      </div>

      <div class="sponsors-grid" [ngClass]="'tier-' + group.tierName.toLowerCase()">
        <div class="sponsor-item" *ngFor="let sponsor of group.sponsors">
          <div class="sponsor-logo-stage">
            <img
              *ngIf="sponsor.photoUrl; else sponsorNameOnly"
              class="sponsor-logo"
              [src]="sponsor.photoUrl"
              [alt]="sponsor.name"
              loading="lazy"
              decoding="async"
            >

            <ng-template #sponsorNameOnly>
              <span class="sponsor-name">{{ sponsor.name }}</span>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
