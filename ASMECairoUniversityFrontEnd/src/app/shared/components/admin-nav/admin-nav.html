<div class="page-wrapper">

  <header class="top-nav">
    <div class="nav-brand">
      <img src="logo/ASME LOGO WHITE.png" alt="ASME Cairo University" />
    </div>
    <div class="nav-breadcrumb">ADMIN PANEL &gt; {{ breadcrumb }}</div>
    <div class="nav-right">
      <span class="admin-name" *ngIf="authService.currentUser() as u">{{ u.name }}</span>
      <div class="avatar">{{ adminInitial }}</div>
      <button type="button" class="btn-events-list" routerLink="/projects">VIEW SITE</button>
      <button type="button" class="btn-logout" (click)="logout()">LOG OUT</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Admin navigation">
      <div class="sidebar-label">ADMIN</div>
      <button type="button" class="sidebar-item" [class.active]="active === 'dashboard'" routerLink="/admin/dashboard">
        DASHBOARD
      </button>
      <button type="button" class="sidebar-item" [class.active]="active === 'projects'" routerLink="/admin/projects">
        PROJECTS
      </button>
      <button type="button" class="sidebar-item" [class.active]="active === 'main-segment'" routerLink="/admin/main-segment">
        <span class="desktop-label">MAIN SEGMENT</span>
        <span class="mobile-label">SEGMENT</span>
      </button>
      <button type="button" class="sidebar-item" [class.active]="active === 'create' || active === 'edit'" routerLink="/admin/create-project">
        <span class="desktop-label">+ CREATE PROJECT</span>
        <span class="mobile-label">+ CREATE</span>
      </button>
    </nav>

    <ng-content></ng-content>
  </div>

</div>
