<div class="page-wrapper">

  <header class="top-nav">
    <div class="nav-brand">ASME CU</div>
    <div class="nav-breadcrumb">ADMIN PANEL &gt; {{ breadcrumb }}</div>
    <div class="nav-right">
      <span class="admin-name" *ngIf="authService.currentUser() as u">{{ u.name }}</span>
      <div class="avatar">{{ adminInitial }}</div>
      <button class="btn-events-list" routerLink="/projects">← PROJECTS LIST</button>
      <button class="btn-logout" (click)="logout()">LOG OUT</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-label">ADMIN</div>
      <button class="sidebar-item" [class.active]="active === 'dashboard'" routerLink="/admin/dashboard">
        📊 DASHBOARD
      </button>
      <button class="sidebar-item" [class.active]="active === 'projects'" routerLink="/admin/projects">
        🗂️ PROJECTS
      </button>
      <button class="sidebar-item" [class.active]="active === 'create' || active === 'edit'" routerLink="/admin/create-project">
        + CREATE PROJECT
      </button>
    </aside>

    <ng-content></ng-content>
  </div>

</div>
