<div class="reservation-card" *ngIf="!hasStarted">

  <div class="card-header">
    <div class="header-icon">
      <i class="fa-solid fa-ticket-alt"></i>
    </div>
    <h2>RESERVE YOUR SPOT</h2>
  </div>

  <div class="card-body">
    <div class="reservation-details">
      <div class="detail-item">
        <p class="detail-label">Starts in:</p>
        <p class="deadline-text">{{ countdownText }}</p>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <a
      *ngIf="externalRegistrationUrl; else internalRegister"
      class="btn btn-primary"
      [href]="externalRegistrationUrl"
      target="_blank"
      rel="noopener"
    >
      Register Now
    </a>

    <ng-template #internalRegister>
      <button type="button" class="btn btn-primary" (click)="onRegister()">
        Register Now
      </button>
    </ng-template>
  </div>

</div>
