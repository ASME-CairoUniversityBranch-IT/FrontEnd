<div class="login-wrapper">
  <header class="top-nav">
    <div class="nav-brand">ASME CU</div>
    <div class="nav-breadcrumb">ADMIN PANEL &gt; SIGN IN</div>
    <div class="nav-right">
      <button type="button" class="btn-back" routerLink="/projects">← PROJECTS LIST</button>
    </div>
  </header>

  <main class="login-main">
    <form class="login-card" (ngSubmit)="onSubmit()" novalidate>
      <div class="login-head">
        <div class="login-badge" aria-hidden="true">CU</div>
        <h1 class="login-title">Admin Sign In</h1>
        <p class="login-subtitle">Sign in to create or manage projects.</p>
      </div>

      <p class="login-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="form-group">
        <label class="field-label" for="email">EMAIL</label>
        <input
          id="email"
          type="email"
          class="form-input"
          name="email"
          autocomplete="email"
          [(ngModel)]="email"
          [disabled]="submitting" />
      </div>

      <div class="form-group">
        <label class="field-label" for="password">PASSWORD</label>
        <input
          id="password"
          type="password"
          class="form-input"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          [disabled]="submitting" />
      </div>

      <button type="submit" class="btn-submit" [disabled]="submitting">
        {{ submitting ? 'SIGNING IN…' : 'SIGN IN →' }}
      </button>
    </form>
  </main>
</div>
