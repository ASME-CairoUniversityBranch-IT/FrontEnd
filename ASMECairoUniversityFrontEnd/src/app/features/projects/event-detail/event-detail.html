<main id="main-content" class="project-detail-page">
  <ng-container *ngIf="vm$ | async as vm">
    <div class="loading-msg" *ngIf="vm.status === 'loading'">
      <span class="spinner"></span>
      <p>Loading event...</p>
    </div>

    <div class="error-msg" role="alert" *ngIf="vm.status === 'notFound'">
      <h1>Event not found</h1>
      <a routerLink="/projects">Back to projects</a>
    </div>

    <ng-container *ngIf="vm.status === 'loaded'">
    <app-project-hero [project]="vm.project" typeLabel="Events"></app-project-hero>

    <div class="project-page-container">
      <div class="main-content">
        <div class="about-card">
          <h2>About This Event</h2>
          <markdown class="markdown-body" [data]="vm.project.longDescription"></markdown>
        </div>

         <app-sponsers [sponsors]="vm.project.sponsors"></app-sponsers>
        <app-speakers [speakers]="vm.project.speakers"></app-speakers>
        <app-partners [partners]="vm.project.partners"></app-partners>
       
        <app-project-gallery [imageUrls]="vm.project.galleryImageUrls"></app-project-gallery>
      </div>

      <div class="right-sidebar">
        <app-reservation [project]="vm.project"></app-reservation>
        <app-project-details [project]="vm.project"></app-project-details>
      </div>
    </div>
    </ng-container>
  </ng-container>
</main>
